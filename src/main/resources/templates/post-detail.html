<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details | Yumyum</title>
    <link rel="stylesheet" th:href="@{/post-detail.css}">
</head>

<body>
    <header class="navbar">
        <a href="/posts" class="logo">yumyum<span>🍳</span></a>

        <nav class="nav-links">
            <a href="/posts">Posts</a>
            <a href="#">My Profile</a>
        </nav>

        <a href="/posts/new" class="create-button">+ Create Post</a>
    </header>

    <main class="container">

        <a href="/posts" class="back-link">← Back to Posts</a>

        <article class="recipe">

            <img
                th:if="${post.imageUrl != null and !#strings.isEmpty(post.imageUrl)}"
                th:src="${post.imageUrl}"
                th:alt="${post.title}"
                class="recipe-image">

            <div class="recipe-content">

                <h1 th:text="${post.title}">Recipe title</h1>

                <div class="recipe-meta">
                    <span th:text="|By ${post.user.username}|">By user</span>
                </div>

                <p
                    class="recipe-description"
                    th:if="${post.description != null and !#strings.isEmpty(post.description)}"
                    th:text="${post.description}">
                    Recipe description
                </p>

                <section class="ingredients">
                    <h2>Ingredients</h2>

                    <div class="ingredients-list"
                         th:text="${post.ingredients}">
                        Ingredients will appear here.
                    </div>
                </section>

                <section class="instructions">
                    <h2>Cooking Instructions</h2>

                    <div class="instructions-list"
                         th:text="${post.instructions}">
                        Cooking instructions will appear here.
                    </div>
                </section>

                <section class="comments">
                    <h2>Comments</h2>
                    <p class="empty-comments">
                        No comments yet. Be the first to share your thoughts!
                    </p>
                </section>
            </div>
        </article>

        <div th:if="${currentUserEmail != null
                 and currentUserEmail == post.user.email}">

            <a th:href="@{/posts/edit(id=${post.id})}"
               class="edit-button">
                Edit Recipe
            </a>

            <form th:action="@{/posts/delete}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this recipe?');">

                <input type="hidden" name="id" th:value="${post.id}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="delete-button">Delete Recipe</button>
            </form>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>
</body>
</html>
