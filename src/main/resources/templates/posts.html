<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumyum</title>
    <link rel="stylesheet" th:href="@{/posts.css}">
</head>

<body>
    <header class="navbar">
        <a href="/posts" class="logo">yumyum<span>🍳</span></a>

        <nav class="nav-links">
            <a href="/posts" class="active">Posts</a>
            <a href="#">My Profile</a>
        </nav>

        <a href="/posts/new" class="create-button">+ Create Post</a>
    </header>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">GOOD FOOD, GOOD MOOD</p>
            <h1>Made with love,<br>shared with <span>yumyum.</span></h1>
            <p class="hero-description">
                Discover delicious recipes and homemade dishes
                shared by our cooking community.
            </p>
        </section>

        <section class="posts-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">FROM OUR COMMUNITY</p>
                    <h2>Latest recipes</h2>
                </div>
                <span class="post-count">Fresh ideas for your next meal</span>
            </div>


            <div class="post-grid">
                <article class="post-card"
                         th:each="post : ${posts}"
                         th:onclick="|window.location.href='/post-detail?id=${post.id}'|">

                    <img
                            th:src="${post.imageUrl}"
                            th:alt="${post.title}"
                            class="post-image"
                    >

                    <div class="post-content">
                        <h3 th:text="${post.title}">Recipe Title</h3>

                        <p class="post-description"
                           th:text="${post.description}">
                            Recipe description
                        </p>

                        <div class="post-meta">
                            <span th:text="|By ${post.user.username}|">By User</span>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>

<script>
    function openPost(id) {
        window.location.href = "/post-detail?id=" + id;
    }
</script>
</body>
</html>
