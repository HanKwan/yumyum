<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumyum</title>
    <link rel="stylesheet" th:href="@{/posts.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
<!--    <link rel="stylesheet" th:href="@{/footer.css}">-->
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('')}"></div>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">GOOD FOOD, GOOD MOOD</p>
            <h1>Made with love,<br>shared with <span>yumyum.</span></h1>
            <p class="hero-description">
                Discover delicious recipes and homemade dishes
                shared by our cooking community.
            </p>
        </section>

        <section class="posts-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">FROM OUR COMMUNITY</p>
                    <h2>Latest recipes</h2>
                </div>
                <span class="post-count">Fresh ideas for your next meal</span>
            </div>


            <div class="post-grid">
                <article class="post-card"
                         th:each="post : ${posts}"
                         th:onclick="|window.location.href='/post-detail?id=${post.id}'|">

                    <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}"
                         th:src="${post.imageUrl}"
                         th:alt="${post.title}"
                         class="post-image">

                    <div th:unless="${post.imageUrl != null and !post.imageUrl.isEmpty()}"
                         class="post-image-placeholder">
                        <span>YumYum</span>
                    </div>

                    <div class="post-content">
                        <h3 th:text="${post.title}">Recipe Title</h3>

                        <p class="post-description"
                           th:text="${post.description}">
                            Recipe description
                        </p>

                        <div class="post-rating">
                            <span>★</span>

                            <span th:if="${ratingMap.containsKey(post.id)}"
                                  th:text="${#numbers.formatDecimal(ratingMap.get(post.id).averageRating, 1, 1)}">
                                0.0
                            </span>

                            <span th:unless="${ratingMap.containsKey(post.id)}">
                                0.0
                            </span>

                            <span th:if="${ratingMap.containsKey(post.id)}"
                                  th:text="|(${ratingMap.get(post.id).reviewCount} reviews)|">
                             </span>

                            <span th:unless="${ratingMap.containsKey(post.id)}">
                                (0 reviews)
                            </span>
                        </div>

                        <!--clickable profile-->
                        <div class="post-meta">
                            <a th:href="@{/profile(id=${post.user.id})}"
                               th:text="|By ${post.user.username}|"
                               onclick="event.stopPropagation()">
                                By User
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>

<script>
    function openPost(id) {
        window.location.href = "/post-detail?id=" + id;
    }
</script>
</body>
</html>
