<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | YumYum</title>

    <link rel="stylesheet" th:href="@{/edit-profile.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

    <main class="edit-container">
        <section class="edit-card">

            <div class="page-heading">
                <h1>Edit Profile</h1>
                <p>Update your personal information</p>
            </div>

            <form th:action="@{/profile/edit}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="photo-section">
                    <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                         th:src="${user.profileImage}"
                         alt="Profile Picture"
                         class="profile-preview">

                    <img th:unless="${user.profileImage != null and !user.profileImage.isEmpty()}"
                         th:src="@{/images/default-profile.png}"
                         alt="Default Profile Picture"
                         class="profile-preview">

                    <div class="photo-info">
                        <h3>Profile Picture</h3>
                        <p>Choose a new picture for your profile.</p>

                        <label for="profileImage" class="upload-button">
                            Choose Photo
                        </label>

                        <input type="file"
                               id="profileImage"
                               name="profileImage"
                               accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           th:value="${user.username}"
                           required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio"
                              name="bio"
                              rows="5"
                              maxlength="500"
                              placeholder="Tell others a little about yourself..."
                              th:text="${user.bio}"></textarea>
                    <small>Maximum 500 characters</small>
                </div>

                <div class="form-actions">
                    <a th:href="@{/profile}" class="cancel-button">Cancel</a>
                    <button type="submit" class="save-button">
                        Save Changes
                    </button>
                </div>

            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
