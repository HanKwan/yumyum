<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe | Yumyum</title>
    <link rel="stylesheet" th:href="@{/create-post.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
</head>

    <body>
    <!-- nav-->
    <div th:replace="~{fragments/navbar :: navbar('post')}"></div>

        <main class="container">
            <a href="/post-detail?id="
               th:href="@{/post-detail(id=${post.id})}"
               class="back-link">← Back to Recipe</a>

            <section class="form-header">
                <p class="eyebrow">MAKE IT EVEN BETTER</p>
                <h1>Edit your <span>recipe.</span></h1>
                <p>Update your recipe details below.</p>
            </section>

            <form class="post-form"
                  th:action="@{/posts/edit}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" name="id" th:value="${post.id}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="title">Recipe title</label>
                    <input
                            type="text"
                            id="title"
                            name="title"
                            th:value="${post.title}"
                            placeholder="e.g. Fluffy Homemade Omurice"
                            required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <textarea
                            id="description"
                            name="description"
                            rows="4"
                            placeholder="Tell us a little about your dish..."
                            th:text="${post.description}"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="imageFile">Recipe Image</label>

                    <div th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}">
                        <p class="field-hint">Current image:</p>
                        <img th:src="${post.imageUrl}"
                             alt="Current recipe image"
                             style="max-width: 250px; border-radius: 10px; margin-bottom: 12px;">
                    </div>

                    <input type="file"
                           id="imageFile"
                           name="imageFile"
                           accept="image/*">

                    <p class="field-hint">
                        Choose a new image only if you want to replace the current one.
                    </p>
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingredients</label>
                    <textarea
                            id="ingredients"
                            name="ingredients"
                            rows="6"
                            placeholder="1 bowl of rice&#10;2 eggs&#10;1 tbsp soy sauce"
                            th:text="${post.ingredients}"
                            required
                    ></textarea>
                    <p class="field-hint">Enter each ingredient on a new line.</p>
                </div>

                <div class="form-group">
                    <label for="instructions">Instructions</label>
                    <textarea
                            id="instructions"
                            name="instructions"
                            rows="8"
                            placeholder="1. Prepare the ingredients&#10;2. Cook everything in a pan&#10;3. Season and serve"
                            th:text="${post.instructions}"
                            required
                    ></textarea>
                    <p class="field-hint">Enter each cooking step on a new line.</p>
                </div>

                <div class="form-actions">
                    <a th:href="@{/post-detail(id=${post.id})}"
                       class="cancel-button">Cancel</a>

                    <button type="submit" class="submit-button">
                        Save Changes
                    </button>
                </div>
            </form>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </main>
    </body>
</html>
